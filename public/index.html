<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>⚔️ RPG Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:var(--tg-theme-bg-color,#1a1a2e);
  --bg2:var(--tg-theme-secondary-bg-color,#16213e);
  --text:var(--tg-theme-text-color,#eee);
  --hint:var(--tg-theme-hint-color,#888);
  --btn:var(--tg-theme-button-color,#5865f2);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --green:#4caf50;--amber:#ff9800;--border:rgba(255,255,255,0.08);--radius:12px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh;padding-bottom:70px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;padding:10px 2px;background:none;border:none;color:var(--hint);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.nav-btn.active{color:var(--btn)}
.nav-btn svg{width:20px;height:20px}
.screen{display:none;padding:16px;max-width:480px;margin:0 auto}
.screen.active{display:block}
.screen-title{font-size:20px;font-weight:700;margin-bottom:16px}
.card{background:var(--bg2);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:12px;color:var(--hint);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.skill-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.skill-row:last-child{margin-bottom:0}
.skill-name{font-size:13px;width:100px;flex-shrink:0}
.skill-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.skill-bar{height:100%;border-radius:3px;transition:width .4s ease;background:var(--btn)}
.skill-val{font-size:13px;font-weight:600;width:28px;text-align:right;flex-shrink:0}
.skill-lvl{font-size:11px;color:var(--hint);width:36px;text-align:right;flex-shrink:0}
.char-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.char-avatar{width:52px;height:52px;border-radius:50%;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.chapter-card{border-left:3px solid var(--btn);margin-bottom:16px}
.chapter-label{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.chapter-name{font-size:15px;font-weight:600;margin-bottom:4px}
.chapter-text{font-size:13px;color:var(--hint);line-height:1.5}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--hint);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.item-check.done{background:var(--green);border-color:var(--green)}
.item-info{flex:1}
.item-name{font-size:14px;line-height:1.4}
.item-name.done{color:var(--hint);text-decoration:line-through}
.item-tag{font-size:11px;margin-top:2px;display:inline-block;padding:1px 6px;border-radius:4px}
.tag-m{background:rgba(88,101,242,.2);color:#818cf8}
.tag-s{background:rgba(168,85,247,.2);color:#c084fc}
.tag-l{background:rgba(74,222,128,.2);color:#4ade80}
.subtask-list{padding:4px 0 4px 30px;border-top:1px solid var(--border);margin-top:2px}
.subtask-item{display:flex;align-items:center;gap:8px;padding:4px 0}
.sub-check{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--hint);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.sub-check.done{background:var(--green);border-color:var(--green)}
.sub-name{font-size:13px;color:var(--hint)}
.sub-name.done{text-decoration:line-through}
.sub-add{display:flex;align-items:center;gap:5px;padding:3px 0;color:var(--hint);font-size:12px;cursor:pointer;background:none;border:none}
.expand-btn{font-size:11px;color:var(--hint);cursor:pointer;background:none;border:none;padding:1px 0}
.ach-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.ach-item:last-child{border-bottom:none}
.ach-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.ach-name{font-size:14px}
.ach-name.received{color:var(--hint)}
.ach-sub{font-size:11px;color:var(--hint);margin-top:2px}
.ach-btn{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:var(--btn);color:var(--btn-text);flex-shrink:0}
.btn{width:100%;padding:12px;border-radius:var(--radius);border:none;background:var(--btn);color:var(--btn-text);font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}
.btn-sm{padding:7px 12px;font-size:13px;width:auto;margin-top:0;border-radius:8px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px;width:100%}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}
.input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;margin-bottom:10px;outline:none}
.input:focus{border-color:var(--btn)}
.select-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.select-opt{padding:8px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:center;transition:all .15s}
.select-opt.active{border-color:var(--btn);background:rgba(88,101,242,.15)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--hint);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab.active{border-color:var(--btn);color:var(--btn);background:rgba(88,101,242,.12)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-label{font-size:12px;color:var(--hint);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.empty{text-align:center;padding:32px 16px;color:var(--hint)}
.loader{text-align:center;padding:40px;color:var(--hint)}
/* All levels accordion */
.level-block{background:var(--bg2);border-radius:var(--radius);margin-bottom:10px;border:1px solid var(--border);overflow:hidden}
.level-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer}
.level-title{font-size:14px;font-weight:600}
.level-track{font-size:11px;color:var(--hint);margin-top:2px}
.level-tasks{padding:0 14px 12px}
.level-count{font-size:12px;color:var(--hint);flex-shrink:0}
.chevron{font-size:12px;color:var(--hint);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
</style>
</head>
<body>

<div id="screen-char" class="screen active">
  <div class="screen-title">⚔️ Персонаж</div>
  <div id="char-content"><div class="loader">Загрузка...</div></div>
</div>

<div id="screen-tasks" class="screen">
  <div class="screen-title">🗡️ Текущий уровень</div>
  <div id="tasks-content"><div class="loader">Загрузка...</div></div>
</div>

<div id="screen-all" class="screen">
  <div class="screen-title">📜 Все уровни</div>
  <div id="all-content"><div class="loader">Загрузка...</div></div>
</div>

<div id="screen-habits" class="screen">
  <div class="screen-title">🔁 Привычки</div>
  <div id="habits-content"><div class="loader">Загрузка...</div></div>
</div>

<div id="screen-ach" class="screen">
  <div class="screen-title">🏆 Достижения</div>
  <div id="ach-content"><div class="loader">Загрузка...</div></div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="navigate('char')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Персонаж
  </button>
  <button class="nav-btn" onclick="navigate('tasks')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Уровень
  </button>
  <button class="nav-btn" onclick="navigate('all')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>Все
  </button>
  <button class="nav-btn" onclick="navigate('habits')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Привычки
  </button>
  <button class="nav-btn" onclick="navigate('ach')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>Достижения
  </button>
</nav>

<!-- EDIT TASK MODAL -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal">
    <div class="modal-title">Редактировать квест</div>
    <input class="input" id="edit-task-input" placeholder="Название задачи" maxlength="200"/>
    <button class="btn" onclick="saveTaskEdit()">Сохранить</button>
    <button class="btn" style="background:rgba(244,67,54,.15);color:#f44336;border:1.5px solid #f44336;margin-top:8px" onclick="deleteTask()">Удалить задачу</button>
    <button class="btn" style="background:transparent;border:1.5px solid var(--btn);color:var(--btn);margin-top:8px" onclick="closeModal('modal-edit')">Отмена</button>
  </div>
</div>
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal-title">Новый квест</div>
    <input class="input" id="task-name-input" placeholder="Название задачи" maxlength="200"/>
    <div class="section-label" style="margin-bottom:8px">Навык</div>
    <div class="select-row">
      <button class="select-opt active" data-skill="Маркетинг" onclick="selectSkill(this)">Маркетинг</button>
      <button class="select-opt" data-skill="SPOTONE" onclick="selectSkill(this)">SPOTONE</button>
      <button class="select-opt" data-skill="Личное" onclick="selectSkill(this)">Личное</button>
    </div>
    <button class="btn" onclick="submitTask()">Добавить</button>
    <button class="btn" style="background:transparent;border:1.5px solid var(--btn);color:var(--btn);margin-top:8px" onclick="closeModal('modal-task')">Отмена</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const API = '';
const initData = tg?.initData ?? '';

// Give Telegram time to initialize before first render
setTimeout(loadAll, tg ? 400 : 0);

let state = {
  skills: [],
  chapters: [],
  activeChapters: [],
  allTasks: [],        // все задачи
  habits: [],
  habitLogs: [],
  achievements: [],
  achFilter: 'all',
  subtasks: {},
  expandedTasks: new Set(),
  expandedLevels: new Set(),
  activeWeek: null,
};

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

function navigate(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
  const idx = ['char','tasks','all','habits','ach'].indexOf(screen);
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if (screen === 'char') renderChar();
  if (screen === 'tasks') renderTasks();
  if (screen === 'all') renderAll();
  if (screen === 'habits') renderHabits();
  if (screen === 'ach') renderAch();
}

async function loadAll() {
  document.getElementById('char-content').innerHTML = '<div class="loader">Загрузка...</div>';
  try {
    // Chapters first (needed for tasks)
    const chapRes = await api('GET', '/api/chapters');
    state.chapters = chapRes.chapters;
    state.activeChapters = chapRes.chapters.filter(c => c.status === 'Активная');

    // All in parallel
    const [skillsRes, habitsRes, achRes, tasksRes] = await Promise.all([
      api('GET', '/api/skills'),
      api('GET', '/api/habits'),
      api('GET', '/api/achievements'),
      api('GET', '/api/tasks'),
    ]);
    state.skills = skillsRes.skills;
    state.habits = habitsRes.habits;
    state.achievements = achRes.achievements;
    state.allTasks = tasksRes.tasks;

    // Habit logs (optional, won't block)
    try {
      const weekRes = await api('GET', '/api/weeks');
      state.activeWeek = weekRes.weeks.find(w => w.status === 'Активная') ?? null;
      if (state.activeWeek) {
        const logsRes = await api('GET', `/api/habit-logs?weekId=${state.activeWeek.id}`);
        state.habitLogs = logsRes.logs;
      }
    } catch(_) {}

    renderChar();
  } catch(e) {
    document.getElementById('char-content').innerHTML = `
      <div class="empty">
        <div style="font-size:32px;margin-bottom:12px">⚠️</div>
        <div style="margin-bottom:16px">${e.message}</div>
        <button class="btn" onclick="loadAll()">Повторить</button>
      </div>`;
  }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function tagClass(skill) {
  if (skill === 'Маркетинг') return 'tag-m';
  if (skill === 'SPOTONE') return 'tag-s';
  return 'tag-l';
}

function trackLabel(chapterName) {
  return chapterName?.startsWith('М') ? 'Маркетинг' : 'SPOTONE';
}

function tasksForChapter(chapterId) {
  return state.allTasks.filter(t => t.chapterIds.includes(chapterId));
}

// ── CHAR ─────────────────────────────────────────────────────────────────────
function renderChar() {
  const charLevel = state.chapters.filter(c => c.status === 'Закрыта').length + 1;
  const skillRows = state.skills.map(s => {
    const pct = Math.min(100, ((s.balls % 20) / 20) * 100);
    return `<div class="skill-row">
      <div class="skill-name">${s.name}</div>
      <div class="skill-bar-bg"><div class="skill-bar" style="width:${pct}%"></div></div>
      <div class="skill-val">${s.balls}</div>
      <div class="skill-lvl">Ур.${s.level}</div>
    </div>`;
  }).join('');

  const chapBlocks = state.activeChapters.length > 0
    ? state.activeChapters.map(c => {
        const tasks = tasksForChapter(c.id);
        const done = tasks.filter(t => t.status === 'done').length;
        return `<div class="card chapter-card">
          <div class="chapter-label">${trackLabel(c.name)}</div>
          <div class="chapter-name">${c.name}</div>
          <div class="chapter-text">${c.narrative || ''}</div>
          <div style="font-size:12px;color:var(--hint);margin-top:8px">${done} из ${tasks.length} задач выполнено</div>
        </div>`;
      }).join('')
    : `<div class="card"><div class="empty">Нет активных уровней</div></div>`;

  document.getElementById('char-content').innerHTML = `
    <div class="char-header">
      <div class="char-avatar">⚔️</div>
      <div>
        <div style="font-size:18px;font-weight:700">Влад</div>
        <div style="font-size:13px;color:var(--hint)">Уровень персонажа: ${charLevel}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Навыки</div>
      ${skillRows}
    </div>
    ${chapBlocks}`;
}

// ── TASKS (current level) ─────────────────────────────────────────────────────
function taskItemHTML(t) {
  const subs = state.subtasks[t.id] ?? [];
  const expanded = state.expandedTasks.has(t.id);
  const doneCount = subs.filter(s => s.done).length;

  const subBlock = expanded ? `
    <div class="subtask-list">
      ${subs.map(s => `
        <div class="subtask-item">
          <div class="sub-check ${s.done?'done':''}" onclick="toggleSubtask('${s.id}','${t.id}',${s.done})">
            ${s.done?'<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5"><path d="M2 6l3 3 5-5"/></svg>':''}
          </div>
          <div class="sub-name ${s.done?'done':''}">${s.name}</div>
        </div>`).join('')}
      <button class="sub-add" onclick="addSubtask('${t.id}')">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v8M2 6h8"/></svg>
        Добавить подзадачу
      </button>
    </div>` : '';

  return `<div class="item" style="flex-direction:column;align-items:stretch;gap:0">
    <div style="display:flex;align-items:flex-start;gap:10px;padding:${expanded?'8px 0 4px':'4px 0'}">
      <div class="item-check ${t.status==='done'?'done':''}" onclick="toggleTask('${t.id}','${t.status}')">
        ${t.status==='done'?'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5"><path d="M2 6l3 3 5-5"/></svg>':''}
      </div>
      <div class="item-info">
        <div class="item-name ${t.status==='done'?'done':''}">${t.name}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px">
          <span class="item-tag ${tagClass(t.skill)}">${t.skill}</span>
          <button class="expand-btn" onclick="toggleExpand('${t.id}')">
            ${expanded?'▲':'▼'} подзадачи${subs.length?` · ${doneCount}/${subs.length}`:''}
          </button>
          <button class="expand-btn" style="margin-left:auto" onclick="openEditTask('${t.id}',\`${t.name.replace(/`/g,'\\`')}\`)">✏️</button>
        </div>
      </div>
    </div>
    ${subBlock}
  </div>`;
}

function renderTasks() {
  if (!state.activeChapters.length) {
    document.getElementById('tasks-content').innerHTML = '<div class="empty">Нет активных уровней</div>';
    return;
  }

  let html = '';
  for (const chap of state.activeChapters) {
    const tasks = tasksForChapter(chap.id);
    const todo = tasks.filter(t => t.status !== 'done');
    const done = tasks.filter(t => t.status === 'done');
    html += `
      <div style="margin-bottom:16px">
        <div class="section-header">
          <div>
            <div class="section-label">${trackLabel(chap.name)}</div>
            <div style="font-size:15px;font-weight:600;margin-top:2px">${chap.name}</div>
          </div>
          <button class="btn btn-sm" onclick="openModal('modal-task','${chap.id}','${trackLabel(chap.name)}')">+ Квест</button>
        </div>
        <div class="card" style="padding:6px 14px">
          ${todo.length ? todo.map(taskItemHTML).join('') : '<div style="padding:12px 0;color:var(--hint);font-size:13px;text-align:center">Все задачи выполнены! 🎉</div>'}
          ${done.length ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
            <div class="card-title">Выполнено (${done.length})</div>
            ${done.map(taskItemHTML).join('')}
          </div>` : ''}
        </div>
      </div>`;
  }

  document.getElementById('tasks-content').innerHTML = html;
}

// ── ALL LEVELS ────────────────────────────────────────────────────────────────
function renderAll() {
  const mChaps = state.chapters.filter(c => c.name.startsWith('М')).sort((a,b) => (a.name>b.name?1:-1));
  const sChaps = state.chapters.filter(c => c.name.startsWith('S')).sort((a,b) => (a.name>b.name?1:-1));

  function chapBlock(chaps, trackName) {
    return chaps.map(c => {
      const tasks = tasksForChapter(c.id);
      const done = tasks.filter(t => t.status === 'done').length;
      const isOpen = state.expandedLevels.has(c.id);
      const isActive = c.status === 'Активная';
      return `<div class="level-block">
        <div class="level-header" onclick="toggleLevel('${c.id}')">
          <div>
            <div class="level-title">${c.name} ${isActive?'<span style="color:var(--btn);font-size:11px">● активный</span>':''}</div>
            <div class="level-track">${trackName}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="level-count">${done}/${tasks.length}</div>
            <div class="chevron ${isOpen?'open':''}">▼</div>
          </div>
        </div>
        ${isOpen ? `<div class="level-tasks">
          ${tasks.length ? tasks.map(t => `
            <div class="item" style="flex-direction:column;align-items:stretch;gap:0">
              <div style="display:flex;align-items:flex-start;gap:10px;padding:4px 0">
                <div class="item-check ${t.status==='done'?'done':''}" onclick="toggleTask('${t.id}','${t.status}');renderAll()">
                  ${t.status==='done'?'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5"><path d="M2 6l3 3 5-5"/></svg>':''}
                </div>
                <div class="item-name ${t.status==='done'?'done':''}">${t.name}</div>
              </div>
            </div>`).join('')
          : '<div style="color:var(--hint);font-size:13px;padding:8px 0">Нет задач</div>'}
        </div>` : ''}
      </div>`;
    }).join('');
  }

  document.getElementById('all-content').innerHTML = `
    <div style="font-size:13px;color:var(--hint);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Маркетинг</div>
    ${chapBlock(mChaps, 'Маркетинг')}
    <div style="font-size:13px;color:var(--hint);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px">SPOTONE</div>
    ${chapBlock(sChaps, 'SPOTONE')}`;
}

function toggleLevel(id) {
  if (state.expandedLevels.has(id)) state.expandedLevels.delete(id);
  else state.expandedLevels.add(id);
  renderAll();
}

// ── HABITS ───────────────────────────────────────────────────────────────────
function renderHabits() {
  const habitMap = Object.fromEntries(state.habits.map(h => [h.id, h]));
  if (!state.activeWeek) {
    document.getElementById('habits-content').innerHTML = `
      <div class="card">
        <div class="empty">Нет активной недели</div>
        <button class="btn" onclick="newWeek()">Начать неделю</button>
      </div>`;
    return;
  }
  const done = state.habitLogs.filter(l => l.done).length;
  const items = state.habitLogs.map(log => {
    const habit = habitMap[log.habitId] ?? {};
    return `<div class="item">
      <div class="item-check ${log.done?'done':''}" onclick="toggleLog('${log.id}','${log.habitId}',${log.done})">
        ${log.done?'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5"><path d="M2 6l3 3 5-5"/></svg>':''}
      </div>
      <div class="item-info">
        <div class="item-name ${log.done?'done':''}">${log.name || habit.name || 'Привычка'}</div>
        <span class="item-tag ${tagClass(habit.skill)}">${habit.skill ?? ''}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('habits-content').innerHTML = `
    <div class="card">
      <div class="section-header">
        <div class="card-title">${done} из ${state.habitLogs.length} выполнено</div>
        <button class="btn btn-sm" onclick="newWeek()">Новая неделя</button>
      </div>
      ${items || '<div style="color:var(--hint);font-size:13px;padding:8px 0">Нет привычек</div>'}
    </div>`;
}

async function toggleLog(logId, habitId, currentDone) {
  const newDone = !currentDone;
  await api('PATCH', '/api/habit-logs', { id: logId, done: newDone });
  const log = state.habitLogs.find(l => l.id === logId);
  if (log) log.done = newDone;
  const habit = state.habits.find(h => h.id === habitId);
  const s = state.skills.find(sk => sk.name === habit?.skill);
  if (s) { if (newDone) s.balls++; else if (s.balls > 0) s.balls--; s.level = Math.floor(s.balls / 20); }
  renderHabits();
}

async function newWeek() {
  if (state.activeWeek && !confirm('Начать новую неделю?')) return;
  const res = await api('POST', '/api/weeks', {});
  state.activeWeek = res.week;
  state.habitLogs = res.habitLogsCreated > 0
    ? (await api('GET', `/api/habit-logs?weekId=${res.week.id}`)).logs
    : [];
  renderHabits();
}

// ── ACHIEVEMENTS ──────────────────────────────────────────────────────────────
function renderAch() {
  const all = state.achievements;
  const filter = state.achFilter;
  const filtered = filter === 'all' ? all
    : filter === 'received' ? all.filter(a => a.received)
    : all.filter(a => a.skill === filter);
  const receivedCount = all.filter(a => a.received).length;
  const tabs = ['all','Маркетинг','SPOTONE','Личное','received'].map(f => {
    const labels = {all:'Все',Маркетинг:'Маркетинг',SPOTONE:'SPOTONE',Личное:'Личное',received:'Получены'};
    return `<button class="tab ${state.achFilter===f?'active':''}" onclick="setAchFilter('${f}')">${labels[f]}</button>`;
  }).join('');
  const items = filtered.map(a => `
    <div class="ach-item">
      <div class="ach-icon">${a.received?'🏆':'🔒'}</div>
      <div style="flex:1">
        <div class="ach-name ${a.received?'received':''}">${a.name}</div>
        <div class="ach-sub">${a.skill} · +${a.balls} баллов${a.isCheckpoint?' · чекпоинт':''}</div>
      </div>
      ${!a.received?`<button class="ach-btn" onclick="receiveAch('${a.id}')">✓</button>`:''}
    </div>`).join('');
  document.getElementById('ach-content').innerHTML = `
    <div style="font-size:13px;color:var(--hint);margin-bottom:8px">Получено: ${receivedCount} из ${all.length}</div>
    <div class="tabs">${tabs}</div>
    <div class="card">${items || '<div class="empty">Нет достижений</div>'}</div>`;
}

function setAchFilter(f) { state.achFilter = f; renderAch(); }

async function receiveAch(id) {
  await api('PATCH', '/api/achievements', { id, received: true });
  const a = state.achievements.find(a => a.id === id);
  if (a) {
    a.received = true;
    const s = state.skills.find(sk => sk.name === a.skill);
    if (s) { s.balls += a.balls; s.level = Math.floor(s.balls / 20); }
  }
  renderAch();
}

// ── TASKS ACTIONS ─────────────────────────────────────────────────────────────
async function toggleTask(id, currentStatus) {
  const newStatus = currentStatus === 'done' ? 'todo' : 'done';
  await api('PATCH', '/api/tasks', { id, status: newStatus });
  const task = state.allTasks.find(t => t.id === id);
  if (task) {
    task.status = newStatus;
    const s = state.skills.find(sk => sk.name === task.skill);
    if (s) {
      if (newStatus === 'done') s.balls++;
      else if (s.balls > 0) s.balls--;
      s.level = Math.floor(s.balls / 20);
    }
  }
  if (document.getElementById('screen-tasks').classList.contains('active')) renderTasks();
}

async function toggleExpand(taskId) {
  if (state.expandedTasks.has(taskId)) {
    state.expandedTasks.delete(taskId);
  } else {
    state.expandedTasks.add(taskId);
    if (!state.subtasks[taskId]) {
      const res = await api('GET', `/api/subtasks?taskId=${taskId}`);
      state.subtasks[taskId] = res.subtasks;
    }
  }
  renderTasks();
}

async function toggleSubtask(subId, taskId, currentDone) {
  const newDone = !currentDone;
  await api('PATCH', '/api/subtasks', { id: subId, done: newDone });
  const subs = state.subtasks[taskId] ?? [];
  const sub = subs.find(s => s.id === subId);
  if (sub) sub.done = newDone;
  const task = state.allTasks.find(t => t.id === taskId);
  const s = state.skills.find(sk => sk.name === task?.skill);
  if (s) { if (newDone) s.balls++; else if (s.balls > 0) s.balls--; s.level = Math.floor(s.balls / 20); }
  const allDone = subs.length > 0 && subs.every(s => s.done);
  if (allDone && task && task.status !== 'done') {
    await api('PATCH', '/api/tasks', { id: taskId, status: 'done' });
    task.status = 'done';
    if (s) { s.balls++; s.level = Math.floor(s.balls / 20); }
  }
  renderTasks();
}

async function addSubtask(taskId) {
  const name = prompt('Название подзадачи:');
  if (!name?.trim()) return;
  const res = await api('POST', '/api/subtasks', { name: name.trim(), taskId });
  if (!state.subtasks[taskId]) state.subtasks[taskId] = [];
  state.subtasks[taskId].push(res.subtask);
  renderTasks();
}

// ── EDIT TASK ─────────────────────────────────────────────────────────────────
function openEditTask(id, name) {
  editingTaskId = id;
  document.getElementById('edit-task-input').value = name;
  document.getElementById('modal-edit').classList.add('open');
}

async function saveTaskEdit() {
  const name = document.getElementById('edit-task-input').value.trim();
  if (!name || !editingTaskId) return;
  await api('PATCH', '/api/tasks', { id: editingTaskId, name });
  const task = state.allTasks.find(t => t.id === editingTaskId);
  if (task) task.name = name;
  closeModal('modal-edit');
  renderTasks();
}

async function deleteTask() {
  if (!editingTaskId) return;
  if (!confirm('Удалить задачу?')) return;
  await api('DELETE', '/api/tasks', { id: editingTaskId });
  state.allTasks = state.allTasks.filter(t => t.id !== editingTaskId);
  closeModal('modal-edit');
  renderTasks();
}

// ── ADD TASK ──────────────────────────────────────────────────────────────────
let selectedSkill = 'Маркетинг';
let modalChapterId = null;
let editingTaskId = null;

function openModal(id, chapterId, track) {
  modalChapterId = chapterId ?? null;
  if (track === 'SPOTONE') {
    selectedSkill = 'SPOTONE';
    document.querySelectorAll('.select-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.skill === 'SPOTONE');
    });
  } else {
    selectedSkill = 'Маркетинг';
    document.querySelectorAll('.select-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.skill === 'Маркетинг');
    });
  }
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.getElementById('task-name-input').value = '';
  modalChapterId = null;
}

function selectSkill(btn) {
  document.querySelectorAll('.select-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedSkill = btn.dataset.skill;
}

async function submitTask() {
  const name = document.getElementById('task-name-input').value.trim();
  if (!name) return;
  let chapterId = modalChapterId;
  if (!chapterId) {
    if (selectedSkill === 'SPOTONE') {
      chapterId = state.activeChapters.find(c => c.name.startsWith('S'))?.id ?? state.activeChapters[0]?.id ?? null;
    } else {
      chapterId = state.activeChapters.find(c => c.name.startsWith('М'))?.id ?? state.activeChapters[0]?.id ?? null;
    }
  }
  const res = await api('POST', '/api/tasks', { name, skill: selectedSkill, chapterId });
  state.allTasks.push(res.task);
  closeModal('modal-task');
  renderTasks();
}

// loadAll вызывается выше с задержкой
</script>
